name: Publish npm release
run-name: npm ${{ inputs.version }} / ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published GOX version (empty selects latest)
        type: string
        default: ''
      request_id:
        description: Distribution run identifier
        type: string
        default: manual
permissions:
  contents: read
concurrency:
  group: npm-publication
  cancel-in-progress: false
jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: release
        uses: gox-lang/server/.github/actions/release-info@main
        with:
          version: ${{ inputs.version }}
  validate:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
  publish:
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    environment: npm-publishing
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.6.2
      - id: release
        uses: gox-lang/server/.github/actions/release-info@main
        with:
          version: ${{ needs.resolve.outputs.version }}
      - name: Prepare tested package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
          npm ci --ignore-scripts
          npm pack --json > packed.json
      - name: Publish immutable npm package
        run: node maintenance/publish.cjs
      - name: Verify public package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm install --global --prefix "$RUNNER_TEMP/gox-npm-check" "@gox-lang/cli@$VERSION" --ignore-scripts=false --foreground-scripts
          "$RUNNER_TEMP/gox-npm-check/bin/gox" version | grep -F "GOX Server v$VERSION"
      - name: Record published version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish GOX npm installer $VERSION"
            git push origin HEAD:main
          fi
          echo "Published and verified @gox-lang/cli@$VERSION." >> "$GITHUB_STEP_SUMMARY"
